name: Build FloatOS
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "external.desc"
      - "Config.in"
      - "external.mk"
      - "configs/**"
      - "board/floatos/**"
      - "README.md"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: floatos-build-${{ github.ref }}
  # Keep a useful in-progress ISO build alive when a small workflow change is pushed.
  cancel-in-progress: false
jobs:
  build:
    name: Build independent FloatOS ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free runner space and inspect resources
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          echo "CPU threads: $(nproc)"
          free -h
          df -h /

      - name: Cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-dl
          key: buildroot-2026.08.1-${{ runner.os }}-${{ hashFiles('configs/**', 'board/floatos/**') }}
          restore-keys: |
            buildroot-2026.08.1-${{ runner.os }}-

      # Buildroot stores compiler results in ~/.buildroot-ccache by default.
      # A run-specific key lets each successful run refresh the cache snapshot.
      - name: Restore Buildroot compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.buildroot-ccache
          key: floatos-ccache-v1-${{ runner.os }}-${{ hashFiles('configs/**', 'board/floatos/patches/**') }}-${{ github.run_id }}
          restore-keys: |
            floatos-ccache-v1-${{ runner.os }}-${{ hashFiles('configs/**', 'board/floatos/patches/**') }}-

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ make bc bison flex file wget curl rsync cpio unzip perl python3 libncurses-dev libssl-dev libelf-dev xorriso mtools dosfstools patch gzip bzip2 tar git

      - name: Download Buildroot 2026.08.1
        run: |
          set -euo pipefail
          wget --https-only -O /tmp/buildroot.tar.xz https://buildroot.org/downloads/buildroot-2026.08.1.tar.xz
          mkdir -p buildroot-src
          tar -xf /tmp/buildroot.tar.xz --strip-components=1 -C buildroot-src

      - name: Configure FloatOS
        run: |
          set -euo pipefail
          make -C buildroot-src BR2_EXTERNAL="$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/output" floatos_x86_64_defconfig
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" olddefconfig
          echo "Normalized FloatOS Buildroot selections and Openbox prerequisites:"
          grep -E '^(BR2_x86_64|BR2_PER_PACKAGE_DIRECTORIES|BR2_LINUX_KERNEL|BR2_TARGET_ROOTFS_ISO9660|BR2_TARGET_ROOTFS_ISO9660_GRUB2|BR2_TARGET_GRUB2|BR2_PACKAGE_XORG7|BR2_PACKAGE_OPENBOX|BR2_PACKAGE_MATCHBOX|BR2_PACKAGE_MATCHBOX_PANEL|BR2_PACKAGE_XSERVER_XORG_SERVER|BR2_PACKAGE_PCMANFM|BR2_PACKAGE_DILLO|BR2_USE_MMU|BR2_USE_WCHAR|BR2_TOOLCHAIN_HAS_THREADS|BR2_TOOLCHAIN_HAS_SYNC_4|BR2_TOOLCHAIN_GCC_AT_LEAST_4_9|BR2_INSTALL_LIBSTDCPP|BR2_TOOLCHAIN_BUILDROOT_CXX|BR2_TOOLCHAIN_BUILDROOT_GLIBC)=' output/.config || true
          for option in BR2_x86_64 BR2_PER_PACKAGE_DIRECTORIES BR2_LINUX_KERNEL BR2_TARGET_ROOTFS_ISO9660 BR2_TARGET_ROOTFS_ISO9660_GRUB2 BR2_PACKAGE_OPENBOX BR2_PACKAGE_XSERVER_XORG_SERVER BR2_PACKAGE_PCMANFM; do
            if ! grep -q "^$option=y$" output/.config; then
              echo "::error::$option is not enabled in the normalized Buildroot configuration."
              exit 1
            fi
          done

      - name: Compile FloatOS from source
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.buildroot-dl" "$HOME/.buildroot-ccache"
          JOBS="$(nproc)"
          echo "Building with $JOBS top-level parallel jobs (Buildroot per-package mode enabled)."
          make -C buildroot-src BR2_EXTERNAL="$GITHUB_WORKSPACE" O="$GITHUB_WORKSPACE/output" BR2_DL_DIR="$HOME/.buildroot-dl" -j"$JOBS"
          make -C buildroot-src O="$GITHUB_WORKSPACE/output" ccache-stats || true
          du -sh "$HOME/.buildroot-ccache" || true

      - name: Verify and prepare bootable ISO
        run: |
          set -euo pipefail
          ISO="output/images/rootfs.iso9660"
          test -s "$ISO"
          xorriso -indev "$ISO" -report_el_torito as_mkisofs
          mkdir -p release
          cp "$ISO" release/FloatOS-0.1-x86_64.iso
          sha256sum release/FloatOS-0.1-x86_64.iso > release/FloatOS-0.1-x86_64.iso.sha256
          ls -lh release/*

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatOS-0.1-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publish direct ISO download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: floatos-latest
          name: FloatOS 0.1 — Latest build
          prerelease: true
          overwrite_files: true
          body: |
            FloatOS 0.1 is an independently assembled x86-64 Linux live system.
            It is built from upstream Linux kernel and userspace source with Buildroot.
            It is not based on Fedora, Bazzite, Ubuntu, or another distribution.
            This first release is a live preview; it does not install to disks.
          files: |
            release/FloatOS-0.1-x86_64.iso
            release/FloatOS-0.1-x86_64.iso.sha256

      - name: Build summary
        run: |
          {
            echo "## FloatOS 0.1 build succeeded"
            echo ""
            echo "- Architecture: x86_64"
            echo "- System: independent Buildroot-generated root filesystem"
            echo "- Desktop: X.Org, Openbox, PCManFM, Xterm and Matchbox panel"
            echo "- ISO: FloatOS-0.1-x86_64.iso"
            echo ""
            echo "Live preview only. Booting it does not modify internal drives."
            echo ""
            cat release/FloatOS-0.1-x86_64.iso.sha256
          } >> "$GITHUB_STEP_SUMMARY"
