set default=0
set timeout=6
set gfxmode=auto
set gfxpayload=keep

menuentry "Start FloatOS 0.1" {
    set root=(cd0)
    linux __KERNEL_PATH__ quiet loglevel=3 vt.global_cursor_default=0
    initrd __INITRD_PATH__
}

menuentry "FloatOS 0.1 — safe graphics" {
    set root=(cd0)
    linux __KERNEL_PATH__ nomodeset loglevel=4
    initrd __INITRD_PATH__
}
